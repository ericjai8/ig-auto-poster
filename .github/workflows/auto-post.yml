name: Auto-post to Instagram

on:
  workflow_dispatch: {}  # manual trigger only — cron disabled for now

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Post next item in queue
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python ig_auto_post.py

      - name: Commit updated queue
        run: |
          git config user.name "ig-auto-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add post_queue.json
          git diff --quiet --cached || git commit -m "chore: remove posted item from queue"
          git push
