name: Generate more content

on:
  workflow_dispatch: {}  # manual trigger only — cron disabled for now

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow

      - name: Generate fact cards
        run: python generate_facts_content.py

      - name: Commit new content
        run: |
          git config user.name "ig-auto-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated_cards/ post_queue.json
          git diff --quiet --cached || git commit -m "chore: generate new fact cards"
          git push
